#Enable Hungerbane mod?
mod_enabled = true
#Healing multiplier from food. 0.5 means food heals 50% of its nutrition value.
# Default: 0.5
# Range: 0.0 ~ 2.0
healMultiplier = 0.5
#Multiplier for healing from food when the Nourished effect is active.
#For example, 1.5 means healing is increased by 50% per level of the effect.
#Set to 1.0 to disable the bonus healing from Nourished.
# Default: 1.5
# Range: 1.0 ~ 2.0
nourishedMultiplier = 1.5
#Multiplier for healing from food when the Hunger effect is active.
#For example, 0.5 means healing is reduced by 50% per level of the effect.
#Set to 1.0 to disable the penalty from Hunger.
# Default: 0.5
# Range: 0.0 ~ 1.0
hungryMultiplier = 0.1
#Amount of health restored when waking up from a bed (in HP, where 2 HP = 1 heart).
#Set to 0.0 to disable healing from sleep.
# Default: 4.0
# Range: 0.0 ~ 20.0
wakeHealAmount = 0.0
